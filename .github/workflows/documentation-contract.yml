name: Documentation contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify requirements and traceability
        run: bash scripts/verify-documentation.sh

