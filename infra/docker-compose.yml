services:
  postgres:
    image: postgres:18.0
    environment:
      POSTGRES_DB: event_operations
      POSTGRES_USER: event_operations
      POSTGRES_PASSWORD: local-only-change-me
    ports: ["5432:5432"]
    volumes: ["event-operations-postgres:/var/lib/postgresql"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U event_operations -d event_operations"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: localadmin, MINIO_ROOT_PASSWORD: local-only-change-me }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["event-operations-objects:/data"]
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["1025:1025", "8025:8025"]
volumes:
  event-operations-postgres:
  event-operations-objects:
